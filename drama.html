    <title>戏录阅读 | 虞宫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+SC:wght@200;300;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.min.css">
    <style>
        body.drama-reader {
            --drama-text-color: #d8d1c6;
            padding-bottom: 0;
            background:
                linear-gradient(180deg, rgba(197, 160, 89, 0.08), transparent 280px),
                #050505;
        }

        .drama-shell {
            width: min(920px, calc(100vw - 32px));
            margin: 0 auto;
            padding: 96px 0 56px;
        }

        .drama-kicker {
            color: var(--yu-gold);
            font-family: 'Cinzel', serif;
            font-size: 11px;
            letter-spacing: 0.24em;
        }

        .drama-title {
            color: #f5f0e6;
            font-family: 'Noto Serif SC', serif;
            font-size: clamp(28px, 7vw, 56px);
            line-height: 1.1;
            letter-spacing: 0;
            margin: 12px 0 18px;
        }

        .drama-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }

        .drama-chip {
            border: 1px solid rgba(197, 160, 89, 0.22);
            background: rgba(255, 255, 255, 0.035);
            color: #b8b0a2;
            padding: 7px 10px;
            font-size: 12px;
        }

        .drama-panel {
            border: 1px solid rgba(197, 160, 89, 0.18);
            background: rgba(8, 8, 8, 0.86);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
        }

        .drama-content {
            white-space: pre-wrap;
            color: var(--drama-text-color);
            font-family: 'Noto Serif SC', serif;
            font-size: clamp(15px, 3.9vw, 18px);
            line-height: 2;
            letter-spacing: 0;
        }

        .drama-tools {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .drama-tool-btn,
        .drama-color-label,
        .drama-select-label {
            min-height: 36px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(197, 160, 89, 0.25);
            background: rgba(255, 255, 255, 0.04);
            color: #c9c1b4;
            padding: 7px 11px;
            font-size: 12px;
            cursor: pointer;
        }

        .drama-select {
            border: 0;
            outline: 0;
            background: transparent;
            color: inherit;
            font-size: 12px;
            cursor: pointer;
        }

        body:not(.day-mode) .drama-select option {
            background: #171717;
            color: #d8d1c6;
        }

        .drama-color-input {
            width: 24px;
            height: 24px;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: pointer;
        }

        body.drama-reader.day-mode {
            background: linear-gradient(180deg, rgba(153, 112, 36, 0.11), transparent 280px), #eee8dc;
        }

        body.day-mode header {
            background: rgba(242, 237, 226, 0.96) !important;
            border-color: rgba(89, 68, 37, 0.12) !important;
        }

        body.day-mode header h1 { color: #28231d !important; }
        body.day-mode header span, body.day-mode header div { color: #746b5e !important; }
        body.day-mode .drama-title { color: #26211b; }
        body.day-mode .drama-chip { background: rgba(255, 255, 255, 0.42); color: #625a50; }
        body.day-mode .drama-panel { background: rgba(250, 247, 239, 0.94); box-shadow: 0 24px 70px rgba(75, 57, 31, 0.12); }
        body.day-mode .drama-tool-btn,
        body.day-mode .drama-color-label,
        body.day-mode .drama-select-label { background: rgba(255, 255, 255, 0.46); color: #51483d; }

        .drama-status {
            min-height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a3a3a3;
            text-align: center;
            line-height: 1.8;
        }

        @media (max-width: 640px) {
            .drama-shell {
                width: min(100% - 24px, 920px);
                padding-top: 84px;
            }

            .drama-panel {
                border-left: 0;
                border-right: 0;
            }
        }
    </style>
</head>

<body class="drama-reader min-h-screen" data-original-work="fanlong-yugong-official-2026"
    data-rights-owner="繁笼">
    <div class="site-original-signature" aria-hidden="true" data-signature="fanlong-yugong-official-2026">
        繁笼官网原创首发
    </div>
    <header
        class="fixed top-0 w-full z-50 bg-black/95 backdrop-blur-md border-b border-white/5 h-16 flex items-center justify-between px-6">
        <button onclick="location.href='index.html'" class="flex flex-col text-left">
            <h1 class="text-xl md:text-3xl font-bold tracking-[0.2em] text-white gold-glow font-cuyasong">虞宫</h1>
            <span class="text-[0.6rem] text-gray-500 font-roman tracking-widest uppercase">Drama Archive</span>
        </button>
        <div class="hidden md:block text-[10px] text-gray-600 font-roman tracking-[0.22em] uppercase">
            Private Link
        </div>
    </header>

    <main class="drama-shell">
        <section id="drama-status" class="drama-status">
            <div>
                <i class="fas fa-circle-notch fa-spin text-yu-gold mb-4 text-xl"></i>
                <p>正在调取戏录...</p>
            </div>
        </section>

        <article id="drama-reader" class="hidden">
            <div class="drama-kicker">YU PALACE DRAMA RECORD</div>
            <h2 id="drama-title" class="drama-title"></h2>
            <div id="drama-meta" class="drama-meta"></div>
            <div class="drama-tools" aria-label="阅读设置">
                <button id="theme-toggle" class="drama-tool-btn" type="button">
                    <i class="fas fa-sun"></i><span>日间模式</span>
                </button>
                <label class="drama-color-label" for="text-color">
                    正文颜色
                    <input id="text-color" class="drama-color-input" type="color" value="#d8d1c6">
                </label>
                <label class="drama-select-label" for="text-font">
                    字体
                    <select id="text-font" class="drama-select">
                        <option value="serif">宋体</option>
                        <option value="kaiti">楷体</option>
                        <option value="fangsong">仿宋</option>
                        <option value="sans">黑体</option>
                        <option value="system">系统字体</option>
                    </select>
                </label>
                <label class="drama-select-label" for="text-size">
                    字号
                    <select id="text-size" class="drama-select">
                        <option value="15">小</option>
                        <option value="18">标准</option>
                        <option value="21">大</option>
                        <option value="24">特大</option>
                    </select>
                </label>
                <label class="drama-select-label" for="line-height">
                    行距
                    <select id="line-height" class="drama-select">
                        <option value="1.7">紧凑</option>
                        <option value="2">标准</option>
                        <option value="2.4">宽松</option>
                    </select>
                </label>
                <button id="reader-reset" class="drama-tool-btn" type="button">恢复默认</button>
            </div>
            <section class="drama-panel">
                <div id="drama-content" class="drama-content p-5 md:p-8"></div>
            </section>
        </article>
    </main>

    <script>
        const params = new URLSearchParams(location.search);
        const id = params.get("id");
        const sig = params.get("sig");
        const statusEl = document.getElementById("drama-status");
        const readerEl = document.getElementById("drama-reader");
        const themeToggle = document.getElementById("theme-toggle");
        const textColor = document.getElementById("text-color");
        const textFont = document.getElementById("text-font");
        const textSize = document.getElementById("text-size");
        const lineHeight = document.getElementById("line-height");
        const dramaContent = document.getElementById("drama-content");
        const READER_PREFS_KEY = "fanlongDramaReaderPrefs";
        const defaults = { theme: "night", color: "#d8d1c6", font: "serif", size: "18", lineHeight: "2" };
        const fontFamilies = {
            serif: "'Noto Serif SC', 'Songti SC', serif",
            kaiti: "'Kaiti SC', 'STKaiti', 'KaiTi', serif",
            fangsong: "'FangSong', 'STFangsong', serif",
            sans: "'PingFang SC', 'Microsoft YaHei', sans-serif",
            system: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        };

        function applyReaderPrefs(prefs) {
            const isDay = prefs.theme === "day";
            document.body.classList.toggle("day-mode", isDay);
            document.body.style.setProperty("--drama-text-color", prefs.color);
            textColor.value = prefs.color;
            textFont.value = fontFamilies[prefs.font] ? prefs.font : defaults.font;
            textSize.value = prefs.size;
            lineHeight.value = prefs.lineHeight;
            dramaContent.style.fontFamily = fontFamilies[textFont.value];
            dramaContent.style.fontSize = `${prefs.size}px`;
            dramaContent.style.lineHeight = prefs.lineHeight;
            themeToggle.innerHTML = isDay
                ? '<i class="fas fa-moon"></i><span>夜间模式</span>'
                : '<i class="fas fa-sun"></i><span>日间模式</span>';
        }

        function getReaderPrefs() {
            try {
                return { ...defaults, ...JSON.parse(localStorage.getItem(READER_PREFS_KEY) || "{}") };
            } catch (_) {
                return { ...defaults };
            }
        }

        function saveReaderPrefs(prefs) {
            localStorage.setItem(READER_PREFS_KEY, JSON.stringify(prefs));
            applyReaderPrefs(prefs);
        }

        let readerPrefs = getReaderPrefs();
        applyReaderPrefs(readerPrefs);
        themeToggle.addEventListener("click", () => {
            readerPrefs.theme = readerPrefs.theme === "day" ? "night" : "day";
            saveReaderPrefs(readerPrefs);
        });
        textColor.addEventListener("input", () => {
            readerPrefs.color = textColor.value;
            saveReaderPrefs(readerPrefs);
        });
        textFont.addEventListener("change", () => {
            readerPrefs.font = textFont.value;
            saveReaderPrefs(readerPrefs);
        });
        textSize.addEventListener("change", () => {
            readerPrefs.size = textSize.value;
            saveReaderPrefs(readerPrefs);
        });
        lineHeight.addEventListener("change", () => {
            readerPrefs.lineHeight = lineHeight.value;
            saveReaderPrefs(readerPrefs);
        });
        document.getElementById("reader-reset").addEventListener("click", () => {
            readerPrefs = { ...defaults };
            saveReaderPrefs(readerPrefs);
        });

        function setStatus(title, detail) {
            statusEl.innerHTML = `<div><p class="text-yu-gold font-bold mb-2">${title}</p><p>${detail || ""}</p></div>`;
        }

        function chip(label, value) {
            if (!value) return "";
            return `<span class="drama-chip">${label}：${String(value).replace(/[&<>"']/g, (m) => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[m]))}</span>`;
        }

        async function loadDrama() {
            if (!id || !sig) {
                setStatus("链接无效", "缺少戏录编号或签名。");
                return;
            }

            try {
                const res = await fetch(`/api/drama?id=${encodeURIComponent(id)}&sig=${encodeURIComponent(sig)}`);
                const data = await res.json();
                if (!res.ok || data.error) {
                    setStatus("无法打开戏录", data.detail || data.error || "链接可能已失效。");
                    return;
                }

                document.title = `${data.title || "戏录阅读"} | 虞宫`;
                document.getElementById("drama-title").textContent = data.title || `戏录-${id}`;
                document.getElementById("drama-content").textContent = data.content || "";
                document.getElementById("drama-meta").innerHTML = [
                    chip("编号", data.id || id),
                    chip("时间", data.date_str),
                    chip("参与", data.participants),
                    chip("备注", data.note)
                ].join("");

                statusEl.classList.add("hidden");
                readerEl.classList.remove("hidden");
            } catch (error) {
                setStatus("服务器暂不可达", error.message);
            }
        }

        loadDrama();
    </script>
</body>

</html>
